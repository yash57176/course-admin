<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Printex Admin Panel</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

</head>

<body>

<!-- Login Page -->

<section id="loginPage" class="login-page">

<div class="login-box">

<h1>Printex Admin</h1>

<p>Login to continue</p>

<input
type="email"
id="email"
placeholder="Admin Email">

<input
type="password"
id="password"
placeholder="Password">

<button id="loginBtn">

Login

</button>

</div>

</section>

<!-- Dashboard -->

<section id="dashboard" class="dashboard">

<!-- Sidebar -->

<div class="sidebar">

<div class="logo">

<h2>Printex</h2>

</div>

<ul>

<li class="active">

<i class="fa-solid fa-house"></i>

Dashboard

</li>

<li>

<i class="fa-solid fa-book"></i>

Courses

</li>

<li>

<i class="fa-solid fa-cart-shopping"></i>

Orders

</li>

<li>

<i class="fa-solid fa-users"></i>

Customers

</li>

<li>

<i class="fa-solid fa-gear"></i>

Settings

</li>

<li id="logoutBtn">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</li>

</ul>

</div>

<!-- Main -->

<div class="main">

<!-- Header -->

<div class="topbar">

<h2>Dashboard</h2>

<div class="admin">

<img src="assets/avatar.png">

<span>Admin</span>

</div>

</div>

<!-- Cards -->

<div class="cards">

<div class="card">

<h3>Total Courses</h3>

<h1 id="courseCount">0</h1>

</div>

<div class="card">

<h3>Total Orders</h3>

<h1 id="orderCount">0</h1>

</div>

<div class="card">

<h3>Pending</h3>

<h1 id="pendingCount">0</h1>

</div>

<div class="card">

<h3>Revenue</h3>

<h1 id="revenue">

₹0

</h1>

</div>

</div>

<!-- Add Course -->

<div class="box">

<h2>Add New Course</h2>

<input
id="courseName"
placeholder="Course Name">

<input
id="coursePrice"
placeholder="Course Price">

<input
id="courseLink"
placeholder="Google Drive Link">

<input
type="file"
id="courseImage">

<button id="addCourseBtn">

Add Course

</button>

</div>

<!-- Orders -->

<div class="box">

<h2>Recent Orders</h2>

<div id="orders">

<!-- Orders From Firebase -->

</div>

</div>

</div>

</section>

<script type="module" src="app.js"></script>

</body>

</html>
